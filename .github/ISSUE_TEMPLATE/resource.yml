name: Offer a missing piece
description: Offer a skill, introduction, tool, dataset, access point, or other useful resource.
title: "[Resource] "
body:
  - type: markdown
    attributes:
      value: |
        ## What can you move?
        Be specific. This issue will be public.
  - type: input
    id: resource
    attributes:
      label: What can you offer?
      placeholder: Grant writing, French translation, data engineering, a logistics introduction
    validations:
      required: true
  - type: textarea
    id: useful_for
    attributes:
      label: What kinds of problems are you useful for?
    validations:
      required: true
  - type: input
    id: geography
    attributes:
      label: Geography / reach
      placeholder: Remote worldwide; Ghana and Côte d'Ivoire in person
  - type: input
    id: availability
    attributes:
      label: Availability / capacity
      placeholder: About 5 hours this month
    validations:
      required: true
  - type: textarea
    id: limits
    attributes:
      label: Constraints
  - type: checkboxes
    id: privacy
    attributes:
      label: Public-information check
      options:
        - label: I understand this offer is public and I have not included confidential or sensitive information.
          required: true
